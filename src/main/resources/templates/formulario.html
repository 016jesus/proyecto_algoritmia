<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Estudiante</title>
</head>
<body>
    <h1>Formulario de Estudiante</h1>
    
    <nav>
        <a href="/">Inicio</a> |
        <a href="/nuevo">Agregar Estudiante</a> |
        <a href="/informe-promedio">Informe Promedio Total</a> |
        <a href="/informe-extremos">Informe Notas Extremas</a>
    </nav>
    
    <hr>
    
    <h2 th:text="${estudiante.id != null ? 'Editar Estudiante' : 'Nuevo Estudiante'}"></h2>
    
    <form th:action="@{/guardar}" th:object="${estudiante}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <table>
            <tr>
                <td><label for="codigo">Código del Estudiante:</label></td>
                <td><input type="text" id="codigo" th:field="*{codigo}" required></td>
            </tr>
            <tr>
                <td><label for="nota1">Nota 1 (20%):</label></td>
                <td><input type="number" id="nota1" th:field="*{nota1}" step="0.01" min="0" max="5" required></td>
            </tr>
            <tr>
                <td><label for="nota2">Nota 2 (40%):</label></td>
                <td><input type="number" id="nota2" th:field="*{nota2}" step="0.01" min="0" max="5" required></td>
            </tr>
            <tr>
                <td><label for="nota3">Nota 3 (40%):</label></td>
                <td><input type="number" id="nota3" th:field="*{nota3}" step="0.01" min="0" max="5" required></td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit">Guardar</button>
                    <a href="/">Cancelar</a>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
